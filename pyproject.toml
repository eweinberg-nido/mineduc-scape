[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineduc-scraper"
version = "1.0.0"
description = "Scraper and dataset builder for the Chilean MINEDUC national curriculum (curriculumnacional.cl)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mineduc-curriculum-db contributors" }]
keywords = ["chile", "mineduc", "curriculum", "education", "scraper", "opendata"]
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "jsonschema>=4.20",
  # Only used by the `indicators` and `tp-modules` passes, which read the
  # Programa de Estudio PDFs; the HTML pipeline never imports it.
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mineduc-scraper = "mineduc_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mineduc_scraper = ["schema/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
