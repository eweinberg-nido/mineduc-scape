name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Validate the committed dataset
        run: mineduc-scraper validate --file data/mineduc_curriculum_full.json

      - name: Check the derived exports rebuild
        run: |
          mineduc-scraper export-slim   -f data/mineduc_curriculum_full.json -o /tmp/slim.json
          mineduc-scraper export-sqlite -f data/mineduc_curriculum_full.json -o /tmp/curriculum.db
          mineduc-scraper split         -f data/mineduc_curriculum_full.json -o /tmp/by_level
          mineduc-scraper validate      -f /tmp/slim.json
